<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;

}

.login-box{

    width:350px;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);

}

h2{

    text-align:center;
    margin-bottom:25px;

}

input{

    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;

}

button{

    width:100%;
    padding:12px;
    background:#0A66C2;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;

}

button:hover{

    background:#084b8a;

}

#error{

    color:red;
    text-align:center;
    margin-top:15px;

}

</style>

</head>

<body>

<div class="login-box">

<h2>🔐 Admin Login</h2>

<form id="loginForm">

<input
type="text"
id="username"
placeholder="Username"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">

Login

</button>

</form>

<p id="error"></p>

</div>

<script>

document
.getElementById("loginForm")
.addEventListener("submit",async(e)=>{

    e.preventDefault();

    const username =
    document.getElementById("username").value;

    const password =
    document.getElementById("password").value;

    const res = await fetch("/login",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            username,
            password
        })

    });

    if(res.ok){

        window.location="/admin";

    }else{

        document
        .getElementById("error")
        .innerText="Invalid Username or Password";

    }

});

</script>

</body>

</html>
