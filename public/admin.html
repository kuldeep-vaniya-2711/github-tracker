<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            padding: 25px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            width: 220px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,.15);
        }

        .card h2 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .chart-box {
           background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
    margin-bottom:30px;
    height:350px;
        }

        .chart-box h2 {
            margin-bottom: 20px;
        }

        .section-title {
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 3px 10px rgba(0,0,0,.15);
        }

        th {
            background: #222;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f7f7f7;
        }
    </style>

</head>

<body>

<h1>📊 Analytics Dashboard</h1>

<div style="
display:flex;
justify-content:flex-end;
margin-bottom:20px;
">

<a href="/logout"
style="
background:#dc3545;
color:white;
padding:10px 18px;
text-decoration:none;
border-radius:8px;
font-weight:bold;
">

🚪 Logout

</a>

</div>

<div class="cards">

    <div class="card">
        <h2 id="total">0</h2>
        <p>Total Visitors</p>
    </div>

    <div class="card">
        <h2 id="github">0</h2>
        <p>GitHub Clicks</p>
    </div>

    <div class="card">
        <h2 id="linkedin">0</h2>
        <p>LinkedIn Clicks</p>
    </div>

    <div class="card">
        <h2 id="resume">0</h2>
        <p>Resume Downloads</p>
    </div>

    <div class="card">
        <h2 id="today">0</h2>
        <p>Today Visitors</p>
    </div>

</div>

<style>
    .controls{ margin-bottom:20px; }
    .export-btn{
        padding:12px 20px;
        background:#28a745;
        color:white;
        border:none;
        border-radius:8px;
        cursor:pointer;
        font-size:16px;
    }
</style>

<div class="controls">

    <button id="exportBtn" class="export-btn">

        📥 Export Visitors CSV

    </button>

</div>

<div class="chart-box">

    <h2>Hourly Visitor Trend</h2>

    <canvas id="hourlyChart" height="120"></canvas>

</div>

<br>

<div class="chart-box">

    <h2>Page Performance</h2>

    <canvas id="visitorChart" height="120"></canvas>

</div>

<div class="chart-box">

    <h2>🌐 Browser Analytics</h2>

    <canvas id="browserChart"></canvas>

</div>

<div class="chart-box">

    <h2>💻 Device Analytics</h2>

    <canvas id="deviceChart"></canvas>

</div>

<div class="chart-box">

    <h2>🌍 Country Analytics</h2>

    <canvas id="countryChart"></canvas>

</div>

<h2 class="section-title">Latest Visitors</h2>

<table>

<thead>

<tr>

<th>Page</th>
<th>Time</th>
<th>IP</th>
<th>Browser</th>

</tr>

</thead>

<tbody id="table">

</tbody>

</table>

<script>



let pageChart;
let hourlyChart;
let browserChart;
let deviceChart;
let countryChart;

function loadAnalytics() {

    fetch("/api/analytics")
    .then(res => res.json())
    .then(data => {

        document.getElementById("total").textContent = data.totalVisitors;
        document.getElementById("github").textContent = data.github;
        document.getElementById("linkedin").textContent = data.linkedin;
        document.getElementById("resume").textContent = data.resume;
        document.getElementById("today").textContent = data.todayVisitors;

        let html = "";

        data.visitors.slice().reverse().forEach(v => {

            html += `
            <tr>
                <td>${v.page}</td>
                <td>${v.displayTime}</td>
                <td>${v.ip}</td>
                <td>${v.browser}</td>
            </tr>
            `;

        });

        document.getElementById("table").innerHTML = html;

        // ================= Hourly Chart =================

        const hourlyCtx = document
            .getElementById("hourlyChart")
            .getContext("2d");

        if (hourlyChart) {
            hourlyChart.destroy();
        }

        hourlyChart = new Chart(hourlyCtx, {

            type: "line",

            data: {

                labels: data.hourlyLabels,

                datasets: [{

                    label: "Visitors",

                    data: data.hourlyCounts,

                    borderColor: "#0A66C2",

                    backgroundColor: "rgba(10,102,194,.2)",

                    borderWidth: 3,

                    fill: true,

                    tension: .4

                }]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                animation: false,

                scales: {

                    y: {

                        beginAtZero: true,

                        ticks: {

                            stepSize: 1

                        }

                    }

                }

            }

        });

        // ================= Page Chart =================

        const pageCtx = document
            .getElementById("visitorChart")
            .getContext("2d");

        if (pageChart) {
            pageChart.destroy();
        }

        pageChart = new Chart(pageCtx, {

            type: "bar",

            data: {

                labels: ["GitHub", "LinkedIn", "Resume"],

                datasets: [{

                    label: "Clicks",

                    data: [
                        data.github,
                        data.linkedin,
                        data.resume
                    ],

                    backgroundColor: [
                        "#24292e",
                        "#0A66C2",
                        "#28a745"
                    ],

                    borderRadius: 8

                }]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                animation: false,

                plugins: {

                    legend: {

                        display: false

                    }

                },

                scales: {

                    y: {

                        beginAtZero: true,

                        ticks: {

                            stepSize: 1

                        }

                    }

                }

            }

        });

        const browserCtx = document
    .getElementById("browserChart")
    .getContext("2d");

if (browserChart) {
    browserChart.destroy();
}

browserChart = new Chart(browserCtx, {

    type: "pie",

    data: {

        labels: data.browserLabels,

        datasets: [{

            data: data.browserCounts,

            backgroundColor: [
                "#4285F4",
                "#34A853",
                "#FBBC05",
                "#EA4335",
                "#8E44AD",
                "#00ACC1"
            ]

        }]

    },

    options: {

        responsive: true,

        maintainAspectRatio: false,

        plugins: {

            legend: {

                position: "bottom"

            }

        }

    }

});
const deviceCtx = document
    .getElementById("deviceChart")
    .getContext("2d");

if (deviceChart) {
    deviceChart.destroy();
}

deviceChart = new Chart(deviceCtx, {

    type: "doughnut",

    data: {

        labels: data.deviceLabels,

        datasets: [{

            data: data.deviceCounts,

            backgroundColor: [
                "#3498db",
                "#2ecc71",
                "#f39c12",
                "#e74c3c"
            ]

        }]

    },

    options: {

        responsive: true,

        maintainAspectRatio: false,

        plugins: {

            legend: {

                position: "bottom"

            }

        }

    }

});

// ================= Country Chart =================

const countryCtx = document
    .getElementById("countryChart")
    .getContext("2d");

if (countryChart) {
    countryChart.destroy();
}

countryChart = new Chart(countryCtx, {

    type: "bar",

    data: {

        labels: data.countryLabels,

        datasets: [{

            label: "Visitors",

            data: data.countryCounts,

            backgroundColor: "#ff9800",

            borderRadius: 8

        }]

    },

    options: {

        responsive: true,

        maintainAspectRatio: false,

        animation: false,

        plugins: {

            legend: {

                display: false

            }

        },

        scales: {

            y: {

                beginAtZero: true,

                ticks: {

                    stepSize: 1

                }

            }

        }

    }

});

    })
    .catch(err => {

        console.error(err);

    });
    

}

loadAnalytics();

document
.getElementById("exportBtn")
.addEventListener("click", () => {

    window.location.href = "/export/csv";

});

// Auto Refresh every 10 seconds
setInterval(loadAnalytics, 10000);



</script>

</body>

</html>
