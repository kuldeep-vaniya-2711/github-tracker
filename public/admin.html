<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Dashboard</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div class="container">

        <h1>📊 Visitor Dashboard</h1>

        <div class="cards">

            <div class="card">
                <h3>Total Visitors</h3>
                <h2 id="totalVisitors">0</h2>
            </div>

            <div class="card">
                <h3>GitHub Clicks</h3>
                <h2 id="githubVisitors">0</h2>
            </div>

            <div class="card">
                <h3>LinkedIn Clicks</h3>
                <h2 id="linkedinVisitors">0</h2>
            </div>

            <div class="card">
    <h3>Resume Downloads</h3>
    <h2 id="resumeVisitors">0</h2>
</div>

            <div class="card">
                <h3>Today's Visitors</h3>
                <h2 id="todayVisitors">0</h2>
            </div>

        </div>

        <table>

            <thead>

                <tr>

                    <th>Page</th>
                    <th>Time</th>
                    <th>IP</th>
                    <th>Browser</th>

                </tr>

            </thead>

            <tbody id="tableBody">

            </tbody>

        </table>

    </div>

    <script src="/app.js"></script>

</body>

</html>
